#
# kani-domination is a standalone stable-Rust CLI. It pins `stable` so it does
# NOT inherit the trust-mc root toolchain (nightly + rustc-dev/rust-src) — the
# whole point is that building the burndown/comparison tool requires no rustc
# internals. (Running a measurement still needs a separately-built trust-mc
# verifier on disk.)
[toolchain]
channel = "stable"
