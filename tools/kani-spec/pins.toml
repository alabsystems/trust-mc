#
# Pinned upstream Kani revisions the generated spec is built from.
# tools/kani-spec/kani-spec refuses to generate when a checkout's HEAD,
# rust-toolchain.toml channel, or a test-bearing submodule gitlink disagrees
# with these pins. Changing a pin is a spec-currency event (plan gate G11):
# regenerate, diff units.jsonl and oracles.jsonl, triage, commit.

schema = "trust-mc.kani-spec.pins/v1"
upstream = "https://github.com/model-checking/kani"

# Continuity rev: the corpus tools/kani-domination measured through 2026-09-08.
[revs.corpus]
rev = "4c0fce8c300e1f049f2b0c6766a5111dfc9ff32e"
nightly = "nightly-2025-12-03"

[revs.corpus.submodules]
"tests/perf/s2n-quic" = "8986c9f5c785db101aa8a26ff403c8ed5d03cb42"

# Spec rev: newest audited Kani main (2026-09-10).
[revs.spec]
rev = "b07abe8a72f8eb1ef1ea3521ca6b00a973d341bc"
nightly = "nightly-2026-08-21"

[revs.spec.submodules]
"tests/perf/s2n-quic" = "a33d369b98a50fd9290fd6586832c969035bdec0"

# Submodules that contribute compiletest units. Kani CI initialises every
# submodule (.github/actions/setup/action.yml: `git submodule update --init
# --depth 1`), and scripts/kani-perf.sh copies tests/perf/overlays/<dir>/ into
# tests/perf/<dir>/ before collecting, so tests/perf/s2n-quic yields perf units.
[submodule_urls]
"tests/perf/s2n-quic" = "https://github.com/aws/s2n-quic"
