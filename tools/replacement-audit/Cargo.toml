[package]
name = "replacement-audit"
version = "0.1.0"
edition = "2024"
default-run = "replacement-audit"
license = "MIT OR Apache-2.0"
description = "Audit trust-mc compiletest per-harness JSON reports for replacement criteria"

# Keep this crate independent from the repository workspace. The dependency
# versions below mirror the root workspace dependency table.
[workspace]

[dependencies]
clap = { version = "4.4.11", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
