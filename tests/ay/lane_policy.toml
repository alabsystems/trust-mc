# Lane policy manifest for scripts/ay-compiletest.sh.
# Part of #1037 DL1 (capability-routed dual lane).
#
# Schema:
# [[entry]]
# path = "tests/ay/<file>.rs"   # required
# harness = "<proof_name>"      # optional; overrides file-level entry when present
# lane = "chc" | "bmc"          # required
# unwind = <positive int>       # required when lane = "bmc"
# reason = "short rationale"    # recommended
# issue = 1037                  # recommended
#
# Keep CHC as the default lane until DL4 seeds bounded BMC candidates.

version = 1

# Kani Arbitrary validity smoke test: finite nondet array/char invariants.
# CHC/Spacer currently returns UNKNOWN on these acyclic validity checks; direct
# BMC is the appropriate solver lane once char nondet values are range-bounded.
