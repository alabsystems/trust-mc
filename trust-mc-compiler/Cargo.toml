[package]
name = "trust-mc-compiler"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The rustc-free library facade (src/lib.rs, src/native.rs) needs only these.
# trust's crates/trust-bmc names this package with default-features = false, so
# it must never reach the rustc_private engine below.
serde_json = { workspace = true }
trust-mc-core = { path = "../trust-mc-core", optional = true }
# The embedded driver binary (src/main.rs) is a thin front door over the engine
# rlib, whose sources are this package's src/ directory (see trust-mc-engine).
trust-mc-engine = { path = "../trust-mc-engine", optional = true, default-features = false }

[features]
default = ['ay', 'driver']
# AY is now the only backend - CBMC/CProver removed in issue #563
ay = ['trust-mc-core', 'trust-mc-engine?/ay']
# The rustc_private engine behind the `trust-mc-compiler` binary.
driver = ['dep:trust-mc-engine']
# Compile-backed CHC/statement corpus tests are opt-in; they live in the engine
# (`targo --unverified test -p trust-mc-engine --lib --features compiler-corpus-tests`).
compiler-corpus-tests = ['trust-mc-engine?/compiler-corpus-tests']

[[bin]]
name = "trust-mc-compiler"
path = "src/main.rs"
required-features = ["driver"]

[package.metadata.rust-analyzer]
# This package uses rustc crates.
rustc_private = true

[lints]
workspace = true
