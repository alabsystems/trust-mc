# Stub registry crate for AY codegen: maps stdlib function paths to StubKind.
# Extracted from trust-mc-compiler/src/codegen_ay/stubs/ for incremental build speed.
# Part of #2997: split codegen_ay into subcrates.

[package]
name = "trust-mc-codegen-stubs"
version = "0.1.0"
edition = "2024"
description = "Stdlib function stub registry for trust-mc AY codegen."
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
