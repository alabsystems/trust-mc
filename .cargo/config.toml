# Limit parallel crate compilation to reduce peak memory usage.
# Issue #3061: OOM on M2 Max during concurrent build/verification — that cap
# was 3. Raised 2026-08-01 for the m21 host (M5 Max, 18 cores, 128 GB); the
# mem pressure the old number guarded against does not exist there. Override
# per-invocation with CARGO_BUILD_JOBS if a smaller host returns.
[build]
jobs = 12

# Git authentication: use system git client instead of libgit2.
[net]
git-fetch-with-cli = true

# Command aliases
[alias]
# Build trust-mc with development configuration.
build-dev = "run --target-dir target/tools -p build-trust-mc -- build-dev"
# Build trust-mc release bundle.
bundle = "run -p build-trust-mc -- bundle"

[env]
# Runtime parallelism limits to prevent OOM (#3061).
# force=true ensures these override any shell-level settings.
# Reduced from 4→2 after repeated kernel panics (2026-03-01).
# With 6 AI sessions, each test/rayon thread adds memory pressure.
RAYON_NUM_THREADS = { value = "2", force = true }
RUST_TEST_THREADS = { value = "2", force = true }
[target.'cfg(all())']
rustflags = [
    "-Ztrust-verify=off", # Global lints/warnings. Need to use underscore instead of -.
    # PIN-COUPLED FLAG, currently disabled: the pin reverted to
    # nightly-2025-12-03 on 2026-08-01 (see rust-toolchain.toml — trust's
    # rustc-dev closure is incomplete), and upstream nightly rejects the flag
    # as an unknown unstable option, killing every rustc invocation including
    # `--print` probes. REINSTATE the line below when the pin returns to
    # `trust`: its verifier is FAIL-CLOSED by default and tries to prove
    # panic-freedom for EVERY unit including third-party build scripts —
    # without it the build dies in `libc`'s build script. SPELLING: both work on the
    # linked stage (re-probed 2026-08-26); `-Ztrust-verify=off` is the one
    # `-Z help` advertises. "wave-2 deleted -Zno-trust-verify=yes" was wrong.
    # Probe: `rustc +trust -Z help | grep trust-verify`.
    # "-Ztrust-verify=off",

    # Purposefully disabled lints
    "-Aclippy::expect_fun_call",
    "-Aclippy::or_fun_call",
    "-Aclippy::new_without_default",

    # New lints that we are not compliant yet
    "-Aclippy::needless-borrow",
    "-Aclippy::bool-to-int-with-if",
]
