# WAS, until 2026-07-30:
#
#   channel = "nightly-2025-12-03"
#   components = ["llvm-tools", "rustc-dev", "rust-src", "rustfmt"]
#
# MOVED to `channel = "trust"` because the ALab stack must not depend on
# upstream Rust: "no more dep on Rust. we have trust." The `trust` toolchain is
# the rustup-linked Trust stage2 (~/.rustup/toolchains/trust ->
# the trust stage2 sysroot).
#
# REVERTED 2026-08-01, after the first real compile against a populated stage2
# (trustc 1.99.0-dev 6fbfab9f8). The RE-CHECK verdicts:
#   1. cargo/targo: SHIPPED. `rustup which cargo` resolves under trust.
#   2. rustc-dev equivalent: PARTIAL — and partial is fatal. stage2 rustlib has
#      librustc_driver/librustc_public, but not the full closure of the
#      compiler's own deps: rustc_public was built against hashbrown 0.17.1,
#      whose rmeta/rlib is NOT installed (only std's 0.15.5 is), so
#      `extern crate rustc_public` dies with E0460 in trust-mc-kani-types on
#      both the raw build and the sanctioned build-dev path.
#   3. rust-src: SHIPPED (lib/rustlib/src/rust/library present) — untestable
#      past the E0460 wall.
#   4. llvm-tools: NOT shipped (bootstrap dist components not selected).
#      rustfmt: shipped as trustfmt.
# Per the rule below ("either the Trust build must start shipping it or this
# pin has to go back"), the pin goes back. FLIP-BACK CONDITION, precisely: the
# Trust build installs the complete rustc-dev closure into the stage2 sysroot
# — every rmeta/rlib the rustc_* crates were compiled against (the hashbrown
# 0.17.1 gap is the observed instance), the way upstream `x.py dist rustc-dev`
# does, or trust-mc builds inside trust's rustc-private-sysroots machinery the
# way first-party tools do. Everything else already works: the front-door bins
# and the 16 lib tests are GREEN under trust.
#
# The workspace links `rustc_private` (trust-mc-compiler is a rustc driver)
# and builds a sysroot with `-Z build-std`, so it needs:
#
#   rustc-dev   librustc_driver / librustc_* AND their full dep closure
#   rust-src    std sources for -Z build-std (build-trust-mc build-dev)
#   llvm-tools  llvm-* used by the coverage/objdump paths
#   rustfmt     `cargo fmt` in CI and the pre-commit checks

[toolchain]
channel = "nightly-2025-12-03"
components = ["llvm-tools", "rustc-dev", "rust-src", "rustfmt"]
