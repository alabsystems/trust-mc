#
# Shared codegen utilities consumed by both chc and statement modules.
# Extracted from trust-mc-compiler/src/codegen_ay/shared.rs to enable
# independent compilation of chc/ and statement/ codegen subcrates.
# Part of #2997: split codegen_ay into subcrates.

[package]
name = "trust-mc-codegen-shared"
version = "0.1.0"
edition = "2024"
description = "Shared signedness, IntoOption, and type utilities for trust-mc AY codegen."
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }

[package.metadata.rust-analyzer]
# This package uses rustc crates.
rustc_private = true
